services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: decisionvault
      POSTGRES_USER: decisionvault
      POSTGRES_PASSWORD: decisionvault
    volumes:
      - decisionvault_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decisionvault -d decisionvault"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./apps/backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - decisionvault_storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ./apps/worker
    env_file: .env
    volumes:
      - decisionvault_storage:/data/storage
    depends_on:
      backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./apps/frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  decisionvault_db:
  decisionvault_storage:
