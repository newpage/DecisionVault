services:
  backend:
    ports:
      - "127.0.0.1:${DV_BACKEND_PORT:-8200}:8000"

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    ports:
      - "127.0.0.1:${DV_FRONTEND_PORT:-3000}:3000"
